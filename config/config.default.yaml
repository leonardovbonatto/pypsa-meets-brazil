#
# Default configuration. Tier-specific files (config.t0.yaml … config.t3.yaml)
# override selectively; nothing is duplicated wholesale.
#
# Every key here feeds the config hash in the run manifest, so a change to any
# value produces a distinguishable run. Keep it meaningful — do not park
# scratch values in this file.

# Spatial resolution. t0 = 4 subsystems, t1 = 27 states,
# t2 = clustered nodal, t3 = full nodal >=230 kV.
tier: t0

# Optional human label for a run. When unset, results land in
# results/<tier>-<config-hash-prefix>/.
run_name: null

snapshots:
  start: "2024-01-01"
  end: "2024-12-31"
  # Pandas offset alias. Hourly matches ONS published resolution for most series.
  resolution: "1h"

# Brazilian subsystems. Names follow ONS conventions; these boundaries are
# preserved as hard constraints during clustering (see the roadmap, Epic 6).
subsystems:
  - SE_CO
  - S
  - NE
  - N

solver:
  # HiGHS is open source and adequate through t2. Nodal unit commitment will
  # realistically need Gurobi or COPT — a switch here, not a rewrite.
  name: highs
  options:
    threads: 4

# Upstream data sources. URLs are templates expanded by the fetch rules.
# Anything fetched here is CC-BY (ONS open data); see the per-dataset entry in
# docs/data-dictionary/ for licence and field meanings.
sources:
  ons:
    curva_carga:
      # Hourly verified load per subsystem, one file per year, published from
      # 2000 onward. See docs/data-dictionary/ons/curva_carga.yaml. Which years
      # to fetch is derived from snapshots.start/end (see snapshot_years in
      # scripts/_common.py), not listed separately here — the two must never
      # be allowed to say different things.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/curva-carga-ho/CURVA_CARGA_{year}.csv
    capacidade_geracao:
      # Installed capacity per generating unit, current snapshot (not year-split).
      # See docs/data-dictionary/ons/capacidade_geracao.yaml.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/capacidade-geracao/CAPACIDADE_GERACAO.csv
    cvu_usina_termica:
      # Thermal-plant variable cost, weekly per plant, one file per year.
      # See docs/data-dictionary/ons/cvu_usina_termica.yaml.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/cvu_usitermica_se/CVU_USINA_TERMICA_{year}.csv
    intercambio_nacional:
      # Real hourly interchange between subsystems, one file per year. Ground
      # truth for T0's inter-subsystem topology and transfer-capacity proxy
      # (ADR-0006). See docs/data-dictionary/ons/intercambio_nacional.yaml.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/intercambio_nacional_ho/INTERCAMBIO_NACIONAL_{year}.csv
    fator_capacidade:
      # Hourly wind/solar capacity factor, per plant/plant-group, one file
      # per (year, month) from 2022 onward - not just year (see
      # snapshot_year_months in scripts/_common.py). Feeds T0's p_max_pu.
      # See docs/data-dictionary/ons/fator_capacidade.yaml.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/fator_capacidade_2_di/FATOR_CAPACIDADE-2_{year}_{month}.csv
    geracao_usina:
      # Hourly verified generation per plant, one file per (year, month).
      # Used to constrain hydro by BACKCASTING (ADR-0007) - observed output
      # as a model input. See docs/data-dictionary/ons/geracao_usina.yaml.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/geracao_usina_2_ho/GERACAO_USINA-2_{year}_{month}.csv
    ena_subsistema:
      # Daily natural inflow energy (ENA) per subsystem, one file per year,
      # published from 2000 onward. Feeds PAR(p) inflow fitting (ADR-0005,
      # SDDP epic stage 1) - see docs/data-dictionary/ons/ena_subsistema.yaml.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/ena_subsistema_di/ENA_DIARIO_SUBSISTEMA_{year}.csv
      # Deliberately its OWN range, not snapshots.start/end (see
      # inflow_history_years in scripts/_common.py): PAR(p) needs decades of
      # history for persistence/drought statistics (PRIMER Sec 4.7), not the
      # single T0 reference year. Capped at 2025: 2026 is still in progress
      # upstream and a partial trailing year should not enter silently.
      years:
        start: 2000
        end: 2025
    ear_subsistema:
      # Daily reservoir storage (EAR) per subsystem, one file per year -
      # ear_max_subsistema is the real max storable energy (reservoir
      # capacity), needed for a genuine hydro-thermal SDDP policy (ADR-0005
      # stage 1e). See docs/data-dictionary/ons/ear_subsistema.yaml.
      url: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/ear_subsistema_di/EAR_DIARIO_SUBSISTEMA_{year}.csv
      years:
        start: 2000
        end: 2025

paths:
  resources: resources
  results: results
  provenance: resources/_provenance
