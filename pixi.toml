#
# Environment definition. `pixi install` reproduces it exactly from pixi.lock.
# Domain libraries (pypsa, atlite, geopandas, …) are added in the PR that first
# needs them — keeping this lean keeps CI and fresh clones fast.

[workspace]
name = "pypsa-meets-brazil"
version = "0.0.0"
description = "Open nodal model of the Brazilian National Interconnected System (SIN) in PyPSA"
authors = ["pypsa-meets-brazil contributors"]
# bioconda is required: snakemake is published there, not on conda-forge.
# conda-forge stays first so it wins for everything else.
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
snakemake-minimal = ">=8.20"
pyyaml = ">=6.0"
pandas = ">=2.2"
numpy = ">=1.26"
requests = ">=2.31"
pandera = ">=0.20"
pypsa = ">=0.31"
highspy = ">=1.7"

[feature.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.9"
pre-commit = ">=4.0"
# Reads the Parquet cuts the sddp environment's Julia stage writes (ADR-0005) -
# dev-only until a later PR makes Parquet consumption part of the production
# pipeline itself.
pyarrow = ">=17.0"

# Julia is ~170 MiB and used only for the SDDP stage (ADR-0005) - its own
# solve-group and environment so a plain `pixi install -e dev` (everyone's
# common case) never has to resolve or fetch it.
[feature.sddp.dependencies]
julia = ">=1.10"

[environments]
default = { features = [], solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }
sddp = { features = ["sddp"], solve-group = "sddp" }

[tasks]
# Resolve the DAG without executing anything — the cheapest sanity check we have.
dry = "snakemake -n"
smoke = "snakemake -j4 --configfile config/test/config.smoke.yaml"

[feature.dev.tasks]
test = "pytest"
lint = "pre-commit run --all-files"
