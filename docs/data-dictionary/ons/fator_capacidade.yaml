notes:
- Field meanings are ONS's own, from the dataset's published data dictionary at https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/fator_capacidade_2_di/DicionarioDados_FatorCapacidade.json.
  Unlike capacidade_geracao (PR-07) and intercambio_nacional (PR-12), this dictionary's
  fields match the real CSV columns exactly - no phantom fields this time.
- 'Large: ~37-40 MB per month, ~150,000+ rows, hourly granularity across 150-200+
  plant/plant-groups. From 2022 onward files are split by month as well as year (see
  snapshot_year_months in scripts/_common.py); years 2009-2021 are published one file
  per year instead.'
- 'val_fatorcapacidade is generation/installed-capacity directly - exactly PyPSA''s
  p_max_pu definition, no unit conversion needed. But 35 of 153,528 rows in January
  2024 exceed 1.0 (max observed: ~1.02) - real measurement/rounding noise around the
  nameplate boundary, not a data error to silently accept. A build step using this
  for p_max_pu must clip to <= 1.0, since PyPSA''s p_max_pu > 1 would let a generator
  exceed its own p_nom.'
- No nulls observed in val_geracaoverificada, val_capacidadeinstalada or val_fatorcapacidade.
- 'A real, verified gap, not an artifact of one month: the SE subsystem has *zero*
  EOLICA (wind) rows in both January and July 2024 (checked both directly), even though
  capacidade_geracao (PR-07) records ~261 MW of wind capacity for SE_CO. That capacity
  is apparently not tracked by this specific ONS-dispatched-plants dataset. A build
  step deriving p_max_pu per (subsystem, technology) has no data for SE_CO wind and
  must document the resulting fallback explicitly rather than silently defaulting.'
- nom_usina_conjunto / id_ons / ceg use this dataset's own identifiers, which do not
  join cleanly against capacidade_geracao's ANEEL CEG codes or cvu_usina_termica's
  planning-model codes - consistent with the cross-dataset ID mismatch already documented
  in the PR-09 handoff. Any aggregation here should group by (subsystem, technology),
  not attempt a per-plant join, for the same reason CVU aggregation did (PR-10).
