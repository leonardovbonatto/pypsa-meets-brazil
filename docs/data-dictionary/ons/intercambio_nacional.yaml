notes:
- Field meanings are ONS's own, from the dataset's published data dictionary at https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/intercambio_nacional_ho/DicionarioDados_Intercambio_Nacional.json.
  That JSON also documents a second field, val_intercambioprogmwmed (scheduled/programmed
  interchange), which is NOT a column in the actual CSV - the same kind of dictionary/data
  mismatch found in capacidade_geracao (PR-07). Built the schema from the real file,
  as always.
- 'MWmed is average power over the interval, not energy - same convention as curva_carga
  and the same trap: multiply by interval hours (1 h here) for MWh.'
- 'Exactly four subsystem-pair boundaries carry data for 2024, each with all 8784
  hours present, no nulls: N-NE, N-SE, NE-SE, SE-S. No N-S or NE-S boundary exists
  in the data. This is the real SIN topology, not an assumption - a triangle (N, NE,
  SE mutually connected) plus a pendant (SE-S). See ADR-0006, which uses this as T0''s
  inter-subsystem topology.'
- 'Sign convention is directional per boundary, not per subsystem: val_intercambiomwmed
  is positive when flow ran id_subsistema_origem -> id_subsistema_destino that hour,
  negative when it reversed. A build step computing a capacity proxy from this must
  take the max of abs(value), not just max(value), or it will understate the capacity
  needed in the reverse direction.'
- '2024 per-boundary flow range (MWmed): N-NE -6019 to +5798, N-SE -4812 to +10492,
  NE-SE -3871 to +8311, SE-S -6338 to +6902. These are realized flows, not rated capacity
  - ADR-0006 uses max(abs(min), abs(max)) per boundary as a documented lower-bound
  proxy for transfer capacity, not a claim about the true rating.'
- 'No PY (Itaipu 50 Hz) rows - consistent with cvu_usina_termica: this dataset only
  covers flows within Brazil''s own 60 Hz SIN.'
- One file per year at a stable URL, .../dataset/intercambio_nacional_ho/INTERCAMBIO_NACIONAL_{year}.csv,
  published from 2000 onward - same shape as curva_carga and cvu_usina_termica; snapshot_years(config)
  applies directly.
