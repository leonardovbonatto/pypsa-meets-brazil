notes:
- Field meanings are ONS's own, from the dataset's CKAN description and column naming;
  this dataset has no separate published JSON dictionary (unlike curva_carga, capacidade_geracao,
  cvu_usina_termica, intercambio_nacional and fator_capacidade).
- 'The largest dataset this project fetches: ~66 MB per month, ~506,000 rows per month,
  ~6.1 million rows for 2024, 760 MB for the full year. Split by (year, month) like
  fator_capacidade - see snapshot_year_months in scripts/_common.py.'
- Built from ALL TWELVE months of 2024, not a single-month sample - following the
  lesson recorded in fator_capacidade's notes (PR-15), where a January-only schema
  wrongly marked a column non-nullable and then rejected the real full-year frame.
- 'POPULATION MISMATCH against capacidade_geracao, verified directly and load-bearing
  for any capacity-factor ratio: this dataset covers ALL plants including ''Pequenas
  Usinas (Tipo III)'', ''TIPO III'' and ''Pequenas Usinas (MMGD)'', whereas capacidade_geracao
  covers only ONS-dispatched TIPO I / II-A / II-B / II-C units. Dividing unfiltered
  hydro generation by capacidade_geracao''s hydro capacity gives a ratio of 1.021
  for subsystem S in January 2024 - physically impossible, and purely an artifact
  of a numerator covering more plants than the denominator. Filtering to TIPO I/II-A/II-B/II-C
  brings every subsystem below 1.0 (S drops to 0.931). Filter, do not clip.'
- val_geracao has real nulls (1,488 in January 2024 alone, all NUCLEAR rows) - not
  zero, genuinely missing. A build step must decide explicitly whether to treat these
  as zero or drop them.
- Values appear in scientific notation in the raw CSV (e.g. '0E-8'); pandas parses
  these as float64 without special handling.
- This dataset is the basis for the interim hydro backcast (ADR-0007). Anything derived
  from it constrains the model with OBSERVED output, so hydro dispatch becomes a model
  input rather than a model result - read ADR-0007 before presenting any number that
  depends on it.
