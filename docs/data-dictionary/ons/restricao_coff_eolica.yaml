- 'Half-hourly constrained-off detail per wind plant. The 2024 files differ from ONS''s published dictionary, which names val_geracao / val_geracaoreferencia; the files carry val_geracaoverificada / val_geracaoestimada (PR-70).'
- 'Built from January 2024 only (about 200 MB per month); null rates for other months are not checked. PR-70 uses only id_subsistema, din_instante, val_geracaoestimada, val_geracaoverificada and flg_geracaorestrita.'
- '2024: unrealised output in restricted periods was 10.4% of potential in NE, 2.6% in N, 1.7% in S.'
