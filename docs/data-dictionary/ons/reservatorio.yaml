notes:
- 'ADR-0008 (SDDP epic, stage 2): this dataset resolves the ADR''s named
  open question (REE-to-subsystem mapping) with real data instead of
  domain-name inference. Joining id_subsistema and nom_ree on the same
  row across all 162 reservoirs gives a clean, unambiguous 1:1 mapping
  for all 12 REEs - verified directly, not assumed. It also corrected a
  guess made while drafting ADR-0008: MADEIRA and TELES PIRES (Amazon-basin
  river names) actually map to subsystem SE, not N as their geography
  would suggest by name alone - exactly why this was checked against real
  data rather than left as inference.'
- '162 real reservoirs, matching PRIMER Sec 2.1''s own "order 100-170"
  estimate for individualized reservoirs almost exactly.'
- 'A significant finding for the epic''s later stages, beyond just this
  PR''s immediate need: ONS''s own dictionary states val_perda "sao os
  mesmos utilizados pelo programa Newave" (are the same values used by
  NEWAVE). Combined with this dataset covering physical characteristics
  (volume, elevation, productivity) that PRIMER/ADR-0008 assumed would
  need hidr.dat parsed from NEWAVE decks via inewave, this may
  substantially de-risk full per-plant individualization (ADR-0008''s
  own named eventual successor) - worth real investigation in that
  future ADR, not assumed to fully replace hidr.dat without checking
  what, if anything, is missing (e.g. cascade routing/travel-time between
  reservoirs is not obviously present in this file).'
- No nulls except the 4 turbine-productivity/head-loss columns, and only
  for the 2 "RESERVATORIO SEM USINA" rows (reservoirs without their own
  plant) - a real, explained pattern, not a data quality problem.
- nom_subsistema spells SE_CO as "SUDESTE/CENTRO-OESTE" here, a fuller
  form than other ONS datasets' plain "SUDESTE" - id_subsistema ("SE")
  is what this project actually keys on via _ons.map_subsystems(), so
  this spelling difference does not affect the pipeline.
