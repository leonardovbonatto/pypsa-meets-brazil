notes:
- 'Source of monthly mean CMO for the 2024 backtest (resources/cmo_monthly.csv),
  and the finer target for PyPSA''s hourly prices once water values are coupled.'
- 'WHOLE days are missing every year, always for all four subsystems at once,
  never partial days: 2020: 1 (2020-05-17); 2021: 2; 2022: 16; 2023: 14;
  2024: 4 (2024-02-08, 02-17, 07-13, 12-29). Most likely DESSEM runs never
  published. build_cmo.py reports monthly coverage and raises on any
  partial-day gap or on subsystems missing different days.'
- 'Negative CMO is real and kept: 2 rows in 2020 (N), 20 in 2021 (N, NE), 114
  in 2022 (NE, SE), none in 2023, 77 in 2024 (all NE, August-September,
  minimum -10.44). NE''s cluster coincides with its wind surplus and curtailment
  season; a lead for the curtailment work, not investigated here.'
- 'One extreme half-hour: N on 2020-10-10 22:30 at 54,729.62 R$/MWh, while the
  other subsystems sat near 300 that day. It lifts N''s October 2020 mean to
  261.9 against a median of 211.9. Kept as published; the monthly output
  carries the median beside the mean.'
