notes:
- Field meanings are ONS's own, from the dataset's published data dictionary at https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/capacidade-geracao/DicionarioDados_Capacidade_Instalada_Geracao.json.
  That JSON lists an extra field, id_ons, which is not actually a column in the CSV
  - the dictionary and the real file disagree; this schema describes the columns that
  actually exist.
- Granularity is per generating unit (nom_unidadegeradora), not per plant - a single
  usina like XINGO has multiple rows, one per turbine. 5631 rows total as of the 2026-08-13
  fetch, 975 of them decommissioned.
- 'id_subsistema includes a fifth code, PY, alongside the four SIN subsystems (N/NE/S/SE).
  Every PY row observed is a single plant, ''ITAIPU 50 HZ'', 7.0 GW total - the Paraguay-frequency
  (50 Hz) side of the binational Itaipu plant, which feeds Paraguay''s grid, not Brazil''s
  60 Hz SIN. Confirmed by the naming, not just inferred: Brazil''s own 60 Hz share
  of Itaipu is a separate set of units already counted under SE. Correctly out of
  scope for a Brazil SIN model - see build_generators.py''s EXCLUDED_SUBSYSTEM_CODES.'
- dat_desativacao NULL means active - stated explicitly in ONS's own dictionary, not
  inferred. 975 of 5631 rows are decommissioned (deactivation date set) as of this
  fetch; build_generators.py filters them out before aggregating.
- This dataset only covers ONS-dispatched units (operating modes TIPO I/II-A/II-B/II-C
  per the dataset's own description) - it excludes MMGD and other distributed generation,
  which ONS tracks separately (see the MMGD registry in Brazilian-Grid-in-PyPSA.md
  Sec 2.6).
- 'Sanity check at fetch time: summed active val_potenciaefetiva nationally (excluding
  PY) is ~192 GW, in the right order of magnitude for Brazil''s installed capacity.
  Hydro dominates at ~110 GW, consistent with Sec 2.3 of the primer. Recompute this
  if a later fetch looks wrong.'
