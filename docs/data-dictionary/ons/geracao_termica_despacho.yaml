notes:
- 'Measured on all of 2024 (12 files, 846,984 rows, 153 plants): no nulls in the verified
  columns.'
- Hourly values are MWmed for that hour, per plant; sum over plants for a subsystem's total.
- Verified inflexibility equals pure plus embedded inflexibility (val_verifinflexibilidade
  = val_verifinflexpura + val_verifinflexembutmerito).
- '2024 subsystem means (MWmed): verified thermal N 1,694, NE 279, S 844, SE 3,764; inflexibility
  987 / 22 / 625 / 2,602. Merit-order dispatch rises sharply in September-October with the
  drought (SE 5,553 in October).'
- 'ADR-0016''s thermal floor is val_verifgeracao minus val_verifordemdemeritoacimadainflex:
  everything that ran for reasons other than price.'
