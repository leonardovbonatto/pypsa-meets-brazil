notes:
- 'Field meanings are ONS''s own, from the dataset''s published data dictionary at
  https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/cvu_usitermica_se/DicionarioDados_CVU_UsinaTermica.json,
  which states val_cvu''s unit directly: ''Valor do Custo Variavel Unitario - CVU,
  em R$/MWh''. This is Brazilian Reais, not USD - do not mix with a cost figure from
  another source without converting.'
- One row per (operating week, plant); 4881 rows for 2024, 52 distinct weeks, 114
  distinct plants, exactly one row per (week, plant) pair - no duplicate revisions
  survive into the published file even though num_revisao varies.
- 'CVU genuinely varies week to week, not just noise: plant GERAMAR1 (subsystem N)
  ranges from 983 to 1198 R$/MWh across 2024''s 52 weeks, tracking fuel cost changes.
  A build step that reduces this to one value per subsystem (the T0 approach) is a
  real simplification worth stating explicitly, not an artifact of the data.'
- 854 of 4881 rows (2024) have val_cvu = 0.0 - not missing data, real zero-cost plants
  (e.g. some biomass/bagasse co-generation, or synchronous-condenser-mode units).
  Do not filter these out as if they were nulls.
- cod_usinaplanejamento uses ONS's own small-integer planning-model plant codes, unrelated
  to capacidade_geracao's ANEEL CEG codes, and nom_usina here is spelled and abbreviated
  differently from capacidade_geracao's nom_usina (e.g. 'GERAMAR1' vs whatever the
  ANEEL-derived name is). There is no clean join key between the two datasets as fetched
  - matching individual plants across them needs a name crosswalk this project does
  not have yet. A subsystem-level aggregate sidesteps this; per-plant matching is
  future work if unit-level thermal dispatch is ever wanted.
- No PY rows - unlike capacidade_geracao, this dataset only covers Brazil's own thermal
  fleet (Itaipu is hydro, not thermal, so this was never going to include it, but
  confirmed by inspection rather than assumed).
- 'Mean CVU by subsystem for 2024 (nonzero plants only, R$/MWh): N 346, S 517, SE
  650, NE 754 - NE and SE, with the least hydro headroom of the four subsystems, running
  the most expensive thermal fleets on average is directionally consistent with PRIMER
  Sec 2.1''s subsystem character description. A sanity check, not a validated result.'
- One file per year at a stable URL, .../dataset/cvu_usitermica_se/CVU_USINA_TERMICA_{year}.csv,
  published from 2005 onward - same shape as curva_carga, snapshot_years(config) applies
  directly.
